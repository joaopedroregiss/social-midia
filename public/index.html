<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background-color: black;
        background-image: url(imagens/background.gif);
        background-repeat: no-repeat;
        background-size: cover;
      }

      .box-form {
        width: 100%;
        max-width: 380px;
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(10px);
        border-radius: 12px;
      }

      .form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      input {
        padding: 12px;
        border: 2px solid #6e8549;
        border-radius: 6px;
      }

      .btn-form {
        padding: 12px;
        color: white;
        background: #4f5f33;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .btn-form:hover {
        background: #6e8549;
      }
    </style>
  </head>

  <body>
    <div class="box-form">
      <div>
        <h1>Entrar</h1>
        <p>Acesse sua conta para continuar.</p>
      </div>

      <div class="form">
        <div class="field">
          <p for="user">Usuário</p>
          <input id="user" type="text" placeholder="Digite seu usuário" />
        </div>

        <div class="field">
          <p for="password">Senha</p>
          <input id="password" type="password" placeholder="Digite sua senha" />
        </div>

        <div>
          <p><input type="checkbox" /> Lembrar da senha</p>
        </div>

        <button class="btn-form" onclick="enviar()">Entrar</button>

        <div>
          <p style="padding: 4px">
            Não possui uma conta?
            <a
              href="register.html"
              style="color: #4f5f33; text-decoration: none"
              >Clique aqui.</a
            >
          </p>
        </div>
      </div>
    </div>
    <script>
      function enviar() {
        const usuario = document.querySelector('#user').value;
        const senha = document.querySelector('#password').value;

        fetch(`http://localhost:3000/api/${usuario}/${senha}`)
          .then((resposta) => resposta.json())
          .then((data) => {
            if (data.CHECK == true) {
              alert('Sucesso!');
              window.location.href = 'home.html';
              localStorage.setItem('name', data.NOME);
            } else {
              alert('Erro. Senha ou usuário incorretos.');
            }
          })
          .catch(() => alert('Erro ao conectar com o servidor.'));
      }
    </script>
  </body>
</html>
